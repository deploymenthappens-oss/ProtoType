<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timeless — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15130f; --paper:#fbfaf7; --line:#e7e1d6;
  --wine:#6b2737; --wine-deep:#521d2b; --gold:#b08d57;
  --success:#1f7a54; --danger:#a83b3b; --muted:#7a7468; --panel:#f4f2ec;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,.brand{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-0.01em;}
button{font-family:'Inter',sans-serif;cursor:pointer;}

.admin-login{max-width:380px;margin:100px auto;padding:38px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 60px -30px rgba(21,19,15,0.25);}
.admin-login h1{font-size:23px;margin:0 0 6px;font-weight:500;}
.admin-login .sub{color:var(--muted);font-size:14px;margin:0 0 24px;}

.field{margin-bottom:17px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:500;}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fbfaf8;transition:border-color .2s ease,background .2s ease;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--wine);background:#fff;}
.field-error{color:var(--wine);font-size:13px;margin-top:6px;display:none;}

.btn-primary{background:var(--wine);color:#fff;border:none;border-radius:999px;padding:13px;font-weight:500;font-size:15px;transition:background .2s ease;}
.btn-primary:hover:not(:disabled){background:var(--wine-deep);}
.btn-secondary{background:#fff;border:1px solid var(--line);border-radius:999px;padding:13px;font-weight:500;transition:background .2s ease;}
.btn-secondary:hover{background:var(--panel);}

.admin-topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 40px;background:var(--ink);color:#fff;}
.admin-topbar .brand{font-size:20px;font-weight:500;}
.logout-btn{background:transparent;border:1px solid rgba(255,255,255,0.28);color:#fff;border-radius:999px;padding:9px 18px;font-size:13.5px;transition:background .2s ease,border-color .2s ease;}
.logout-btn:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.5);}

.tabs{display:flex;gap:6px;padding:0 40px;border-bottom:1px solid var(--line);background:#fff;}
.tab-btn{background:none;border:none;padding:16px 18px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;font-size:14.5px;transition:color .2s ease;}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--wine);}
.tab-panel{display:none;padding:32px 40px 80px;}
.tab-panel.active{display:block;}

.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.panel-head h2{margin:0;font-size:22px;font-weight:500;}
.panel-head .btn-primary{flex:none;padding:11px 20px;font-size:14px;}

.table-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:900px;}
th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle;}
th{color:var(--muted);font-weight:500;font-size:12.5px;text-transform:none;background:var(--panel);}
tr:last-child td{border-bottom:none;}
td img.thumb{width:42px;height:42px;object-fit:cover;border-radius:8px;background:var(--panel);}

.status-badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:500;background:var(--panel);border:1px solid var(--line);}
.order-items-line{color:var(--muted);font-size:13px;}

/* Animated status pipeline */
.status-cell{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
.status-pipeline{position:relative;display:inline-flex;background:var(--panel);border-radius:999px;padding:3px;}
.pipe-indicator{position:absolute;top:3px;bottom:3px;left:3px;border-radius:999px;background:var(--wine);transition:transform .32s cubic-bezier(.22,1,.36,1),width .32s cubic-bezier(.22,1,.36,1);z-index:0;}
.pipe-step{position:relative;z-index:1;border:none;background:transparent;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .25s ease;}
.pipe-step:hover:not(.active){color:var(--ink);}
.pipe-step.active{color:#fff;}
.cancel-link{background:none;border:none;color:var(--danger);font-size:11.5px;padding:0;font-weight:500;}
.cancel-link:hover{text-decoration:underline;}
.cancelled-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#fbeaea;border:1px solid #f0c9c9;color:var(--wine);font-size:12px;font-weight:500;}
.reactivate-link{background:none;border:none;color:var(--wine);font-size:11.5px;padding:0;font-weight:500;text-decoration:underline;}

/* Webhook delivery status */
.webhook-cell{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
.webhook-check-btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:500;color:var(--ink);}
.webhook-check-btn:hover:not(:disabled){background:var(--panel);}
.webhook-check-btn:disabled{opacity:.6;cursor:default;}
.webhook-status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:5px 10px;border-radius:999px;background:var(--panel);color:var(--muted);}
.webhook-status .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.webhook-status.ok{background:#e4f4ec;color:var(--success);}
.webhook-status.fail{background:#fbeaea;color:var(--danger);}
.webhook-status.pending{background:var(--panel);color:var(--muted);}
.webhook-meta{font-size:11px;color:var(--muted);}
.webhook-error{font-size:11px;color:var(--danger);}
.webhook-message{font-size:11.5px;color:var(--ink);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;cursor:help;}

/* Tracking / ETA inline editor in the orders table */
.tracking-cell{display:flex;flex-direction:column;gap:6px;min-width:150px;}
.tracking-cell input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;font-family:inherit;background:#fbfaf8;transition:border-color .2s ease,background .2s ease;}
.tracking-cell input:focus{outline:none;border-color:var(--wine);background:#fff;}
.save-tracking-btn{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:11.5px;font-weight:500;transition:background .2s ease;}
.save-tracking-btn:hover{background:var(--panel);}
.order-number-cell{font-weight:500;font-size:12.5px;}

.row-actions button{background:none;border:none;color:var(--wine);font-size:13px;padding:0;margin-right:14px;font-weight:500;}
.row-actions .delete{color:var(--danger);}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(21,19,15,0.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal-backdrop.open{display:flex;}
.modal{background:#fff;border-radius:20px;width:100%;max-width:420px;padding:34px;box-shadow:0 30px 60px -20px rgba(21,19,15,0.35);animation:modalIn .3s cubic-bezier(.22,1,.36,1);max-height:88vh;overflow-y:auto;}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal h2{margin:0 0 6px;font-size:22px;font-weight:500;}
.modal .sub{color:var(--muted);font-size:14px;margin:0 0 22px;}
.modal-actions{display:flex;gap:10px;margin-top:6px;}
.modal-actions .btn-secondary,.modal-actions .btn-primary{flex:1;}
.modal-actions .btn-primary:disabled{opacity:.55;cursor:not-allowed;}

.toast{position:fixed;bottom:26px;right:26px;background:var(--ink);color:#fff;padding:13px 20px;border-radius:10px;font-size:14px;opacity:0;transform:translateY(10px);transition:all .25s ease;pointer-events:none;z-index:60;}
.toast.show{opacity:1;transform:translateY(0);}

.image-upload{display:flex;align-items:center;gap:14px;}
.image-preview{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--panel);border:1px solid var(--line);flex:none;}
.image-upload-controls{flex:1;min-width:0;}
.upload-btn{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-size:13.5px;font-weight:500;transition:background .2s ease;}
.upload-btn:hover{background:var(--panel);}
.upload-hint{color:var(--muted);font-size:12px;margin:6px 0 0;}
.upload-status{font-size:12.5px;margin-top:6px;display:none;}
.upload-status.uploading{display:block;color:var(--muted);}
.upload-status.error{display:block;color:var(--wine);}

@media (max-width:640px){
  .admin-topbar,.tabs,.tab-panel{padding-left:18px;padding-right:18px;}
  table{font-size:13px;}
}
</style>
</head>
<body>

<div id="loginView">
  <div class="admin-login">
    <h1>Admin sign in</h1>
    <p class="sub">Sign in with the admin account created in Supabase Auth.</p>
    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="admin@yourstore.com" />
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" />
    </div>
    <p class="field-error" id="loginError"></p>
    <button class="btn-primary" id="loginBtn" style="width:100%;">Sign in</button>
  </div>
</div>

<div id="dashboardView" style="display:none;">
  <header class="admin-topbar">
    <div class="brand">Timeless admin</div>
    <button class="logout-btn" id="logoutBtn">Sign out</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="products">Products</button>
    <button class="tab-btn" data-tab="orders">Orders</button>
  </nav>

  <section class="tab-panel active" id="tab-products">
    <div class="panel-head">
      <h2>Products</h2>
      <button class="btn-primary" id="newProductBtn">Add product</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th></th><th>Name</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead>
        <tbody id="productsTableBody"></tbody>
      </table>
    </div>
  </section>

  <section class="tab-panel" id="tab-orders">
    <div class="panel-head"><h2>Orders</h2></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Order #</th><th>Customer</th><th>Phone</th><th>Items</th><th>Total</th><th>Status</th><th>Tracking</th><th>Message</th><th>Placed</th></tr></thead>
        <tbody id="ordersTableBody"></tbody>
      </table>
    </div>
  </section>
</div>

<div class="modal-backdrop" id="productBackdrop">
  <div class="modal">
    <h2 id="productModalTitle">Add product</h2>
    <p class="sub">Products marked inactive won't show in the store.</p>
    <div class="field"><label for="pName">Name</label><input type="text" id="pName" /></div>
    <div class="field"><label for="pDescription">Description</label><textarea id="pDescription" rows="2"></textarea></div>
    <div class="field"><label for="pPrice">Price</label><input type="number" id="pPrice" step="0.01" min="0" /></div>
    <div class="field"><label for="pStock">Stock</label><input type="number" id="pStock" step="1" min="0" /></div>
    <div class="field">
      <label for="pImageFile">Product image</label>
      <div class="image-upload">
        <img id="pImagePreview" class="image-preview" src="https://placehold.co/80x80?text=%20" alt="" />
        <div class="image-upload-controls">
          <label class="upload-btn" for="pImageFile">Choose image</label>
          <input type="file" id="pImageFile" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none;" />
          <p class="upload-hint">JPEG, PNG, WebP or GIF · up to 5MB</p>
          <p class="field-error upload-status" id="uploadStatus"></p>
        </div>
      </div>
      <input type="hidden" id="pImage" />
    </div>
    <div class="field">
      <label for="pActive">Status</label>
      <select id="pActive"><option value="true">Active</option><option value="false">Inactive</option></select>
    </div>
    <p class="field-error" id="productError"></p>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelProduct">Cancel</button>
      <button class="btn-primary" id="saveProduct">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============== Supabase config — fill these in ==============
const SUPABASE_URL = "__SUPABASE_URL__";
const SUPABASE_ANON_KEY = "__SUPABASE_ANON_KEY__";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// ================================================================

let editingProductId = null;
let currentProducts = [];
const loginView = document.getElementById("loginView");
const dashboardView = document.getElementById("dashboardView");
const toast = document.getElementById("toast");

checkSession();
document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("logoutBtn").addEventListener("click", async () => { await supabaseClient.auth.signOut(); });

// Reacts to auth state changes as they happen — not just on page
// load. Covers: token refresh failing, the session expiring, or
// the admin signing out in another tab. SIGNED_IN/TOKEN_REFRESHED
// keep the dashboard in sync; SIGNED_OUT bounces back to login.
supabaseClient.auth.onAuthStateChange((event, session) => {
  if (session) {
    if (dashboardView.style.display === "none") showDashboard();
  } else {
    showLogin();
  }
});

async function checkSession() {
  const { data } = await supabaseClient.auth.getSession();
  if (data.session) showDashboard(); else showLogin();
}

async function login() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errorEl = document.getElementById("loginError");
  errorEl.style.display = "none";
  if (!email || !password) { errorEl.textContent = "Enter your email and password."; errorEl.style.display = "block"; return; }
  const loginBtn = document.getElementById("loginBtn");
  loginBtn.disabled = true;
  loginBtn.textContent = "Signing in…";
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  loginBtn.disabled = false;
  loginBtn.textContent = "Sign in";
  if (error) { errorEl.textContent = error.message; errorEl.style.display = "block"; return; }
  // showDashboard() also fires via onAuthStateChange above; calling
  // it here too just avoids a flash of the login form while that
  // event is still in flight.
  showDashboard();
}

function showLogin() { loginView.style.display = "block"; dashboardView.style.display = "none"; }
function showDashboard() { loginView.style.display = "none"; dashboardView.style.display = "block"; loadProducts(); loadOrders(); }

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
    // The Orders table is rendered while its panel is still
    // display:none (Products is the default active tab), so every
    // offsetWidth/offsetLeft read in positionAllPipeIndicators() came
    // back 0 and the sliding pill collapsed. Recompute now that the
    // panel is actually visible.
    if (btn.dataset.tab === "orders") positionAllPipeIndicators();
  });
});

// Recompute on resize too, since offsetWidth/offsetLeft change with
// the viewport (e.g. status labels wrapping differently).
window.addEventListener("resize", positionAllPipeIndicators);

async function loadProducts() {
  const { data, error } = await supabaseClient.from("products").select("*").order("created_at", { ascending: false });
  if (error) return console.error(error);
  currentProducts = data || [];
  renderProductsTable(currentProducts);
}

function renderProductsTable(products) {
  const body = document.getElementById("productsTableBody");
  if (products.length === 0) { body.innerHTML = `<tr><td colspan="6">No products yet.</td></tr>`; return; }
  body.innerHTML = products.map(p => `
    <tr>
      <td><img class="thumb" src="${escapeAttr(p.image_url || placeholderImg())}" alt="" /></td>
      <td>${escapeHtml(p.name)}</td>
      <td>$${Number(p.price).toFixed(2)}</td>
      <td>${p.stock}</td>
      <td><span class="status-badge">${p.is_active ? "Active" : "Inactive"}</span></td>
      <td class="row-actions">
        <button class="edit" data-id="${p.id}">Edit</button>
        <button class="delete" data-id="${p.id}">Delete</button>
      </td>
    </tr>`).join("");
  body.querySelectorAll(".edit").forEach(b => b.addEventListener("click", () => openProductModal(products.find(p => p.id === b.dataset.id))));
  body.querySelectorAll(".delete").forEach(b => b.addEventListener("click", () => deleteProduct(b.dataset.id)));
}

document.getElementById("newProductBtn").addEventListener("click", () => openProductModal(null));
document.getElementById("cancelProduct").addEventListener("click", closeProductModal);
document.getElementById("saveProduct").addEventListener("click", saveProduct);

let uploadingImage = false;

function openProductModal(product) {
  editingProductId = product ? product.id : null;
  document.getElementById("productModalTitle").textContent = product ? "Edit product" : "Add product";
  document.getElementById("pName").value = product?.name || "";
  document.getElementById("pDescription").value = product?.description || "";
  document.getElementById("pPrice").value = product?.price ?? "";
  document.getElementById("pStock").value = product?.stock ?? "";
  document.getElementById("pImage").value = product?.image_url || "";
  document.getElementById("pImagePreview").src = product?.image_url || placeholderImg();
  document.getElementById("pImageFile").value = "";
  uploadingImage = false;
  setUploadStatus("", false);
  document.getElementById("pActive").value = product ? String(product.is_active) : "true";
  document.getElementById("productError").style.display = "none";
  document.getElementById("productBackdrop").classList.add("open");
}
function closeProductModal() { document.getElementById("productBackdrop").classList.remove("open"); }

// ---- Image upload (Supabase Storage) ----
const ALLOWED_IMAGE_TYPES = ["image/jpeg", "image/png", "image/webp", "image/gif"];
const MAX_IMAGE_BYTES = 5 * 1024 * 1024; // 5MB, matches the bucket's server-side limit

document.getElementById("pImageFile").addEventListener("change", handleImageSelected);

async function handleImageSelected(e) {
  const file = e.target.files[0];
  if (!file) return;

  // Client-side checks first (fast feedback); the storage bucket
  // enforces the same rules server-side as a backstop.
  if (!ALLOWED_IMAGE_TYPES.includes(file.type)) {
    setUploadStatus("Please choose a JPEG, PNG, WebP or GIF image.", true);
    e.target.value = "";
    return;
  }
  if (file.size > MAX_IMAGE_BYTES) {
    setUploadStatus("Image is too large — max 5MB.", true);
    e.target.value = "";
    return;
  }

  uploadingImage = true;
  setUploadStatus("Uploading…", false);
  document.getElementById("saveProduct").disabled = true;

  try {
    // Random, extension-only filename — never trust the original
    // filename (avoids path traversal / overwrite collisions).
    const ext = file.type.split("/")[1] === "jpeg" ? "jpg" : file.type.split("/")[1];
    const path = `${crypto.randomUUID()}.${ext}`;

    const { error: uploadError } = await supabaseClient
      .storage.from("product-images")
      .upload(path, file, { cacheControl: "3600", upsert: false, contentType: file.type });
    if (uploadError) throw uploadError;

    const { data: publicUrlData } = supabaseClient
      .storage.from("product-images")
      .getPublicUrl(path);

    document.getElementById("pImage").value = publicUrlData.publicUrl;
    document.getElementById("pImagePreview").src = publicUrlData.publicUrl;
    setUploadStatus("Image uploaded.", false);
  } catch (err) {
    setUploadStatus(err.message || "Upload failed. Please try again.", true);
  } finally {
    uploadingImage = false;
    document.getElementById("saveProduct").disabled = false;
  }
}

function setUploadStatus(msg, isError) {
  const el = document.getElementById("uploadStatus");
  el.textContent = msg;
  el.classList.toggle("error", isError);
  el.style.display = msg ? "block" : "none";
}

async function saveProduct() {
  if (uploadingImage) { setUploadStatus("Please wait for the image to finish uploading.", true); return; }
  const name = document.getElementById("pName").value.trim();
  const description = document.getElementById("pDescription").value.trim();
  const price = parseFloat(document.getElementById("pPrice").value);
  const stock = parseInt(document.getElementById("pStock").value, 10);
  const image_url = document.getElementById("pImage").value.trim();
  const is_active = document.getElementById("pActive").value === "true";
  const errorEl = document.getElementById("productError");
  if (!name || isNaN(price) || price < 0 || isNaN(stock) || stock < 0) {
    errorEl.textContent = "Fill in a valid name, price and stock."; errorEl.style.display = "block"; return;
  }
  const payload = { name, description, price, stock, image_url, is_active };
  const query = editingProductId
    ? supabaseClient.from("products").update(payload).eq("id", editingProductId)
    : supabaseClient.from("products").insert(payload);
  const { error } = await query;
  if (error) { errorEl.textContent = error.message; errorEl.style.display = "block"; return; }
  closeProductModal();
  showToast(editingProductId ? "Product updated" : "Product added");
  loadProducts();
}

async function deleteProduct(id) {
  if (!confirm("Delete this product? This can't be undone.")) return;
  const product = currentProducts.find(p => p.id === id);
  const { error } = await supabaseClient.from("products").delete().eq("id", id);
  if (error) return showToast(error.message);
  // Best-effort cleanup of the uploaded image; ignore failures (e.g.
  // the image_url wasn't one of our uploads) so deletion still succeeds.
  if (product?.image_url && product.image_url.includes("/product-images/")) {
    const path = product.image_url.split("/product-images/")[1];
    if (path) supabaseClient.storage.from("product-images").remove([path]).catch(() => {});
  }
  showToast("Product deleted");
  loadProducts();
}

// ---- Orders: status pipeline, tracking, and delivery-message status ----

const STATUS_STEPS = ["ordered", "prepared", "shipped", "completed"];
const STATUS_LABELS = { ordered: "Ordered", prepared: "Prepared", shipped: "Shipped", completed: "Completed" };
const EVENT_LABELS = {
  order_placed: "Order confirmation",
  order_status_changed: "Status update",
  order_fulfilled: "Completion message",
  order_shipping_updated: "Tracking update"
};
const MESSAGE_LABELS = { pending: "Sending…", sent: "Sent", failed: "Failed" };

let currentOrders = [];
let latestLogByOrder = {};
let notifChannel = null;
let ordersChannel = null;
let ordersReloadTimer = null;

async function loadOrders() {
  const { data, error } = await supabaseClient
    .from("orders")
    .select("*, order_items(product_name, quantity, unit_price)")
    .order("created_at", { ascending: false });
  if (error) return console.error(error);
  currentOrders = data || [];
  await loadNotificationLogs(currentOrders.map(o => o.id));
  renderOrdersTable(currentOrders);
  subscribeNotificationLogs();
  subscribeOrders();
}

// Live updates for the orders list itself: a new order coming in
// from the storefront, or a status/tracking change made from another
// admin tab, both land here instantly instead of waiting for a
// manual page refresh. Requires "orders" and "order_items" to be
// added to the supabase_realtime publication (see the reliability
// migration) — notification_logs and products already were, orders
// and order_items were not, which is why only those two updated live
// before. Debounced because create_order() touches orders + several
// order_items rows in one transaction, and a status change plus its
// notification_logs insert can also arrive within milliseconds of
// each other.
function subscribeOrders() {
  if (ordersChannel) return;
  const scheduleReload = () => {
    clearTimeout(ordersReloadTimer);
    ordersReloadTimer = setTimeout(loadOrders, 250);
  };
  ordersChannel = supabaseClient
    .channel("admin-orders")
    .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, scheduleReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "order_items" }, scheduleReload)
    .subscribe();
}

// Pulls every log for the orders currently shown and keeps only the
// most recent one per order (rows come back newest-first, so the
// first one seen per order_id wins).
async function loadNotificationLogs(orderIds) {
  latestLogByOrder = {};
  if (!orderIds.length) return;
  const { data, error } = await supabaseClient
    .from("notification_logs")
    .select("*")
    .in("order_id", orderIds)
    .order("created_at", { ascending: false });
  if (error) { console.error(error); return; }
  (data || []).forEach(log => {
    if (!latestLogByOrder[log.order_id]) latestLogByOrder[log.order_id] = log;
  });
}

// Live updates: the moment n8n calls report_notification_result (or
// a new status change inserts a fresh pending row), this flips the
// badge in place — no reload, no polling required.
function subscribeNotificationLogs() {
  if (notifChannel) return;
  notifChannel = supabaseClient
    .channel("admin-notification-logs")
    .on("postgres_changes", { event: "*", schema: "public", table: "notification_logs" }, payload => {
      const log = payload.new;
      if (!log) return;
      const existing = latestLogByOrder[log.order_id];
      if (!existing || log.id === existing.id || new Date(log.created_at) >= new Date(existing.created_at)) {
        latestLogByOrder[log.order_id] = log;
        updateWebhookCellInPlace(log.order_id);
      }
    })
    .subscribe();
}

function renderOrdersTable(orders) {
  const body = document.getElementById("ordersTableBody");
  if (orders.length === 0) { body.innerHTML = `<tr><td colspan="9">No orders yet.</td></tr>`; return; }
  body.innerHTML = orders.map(o => {
    const itemsLine = (o.order_items || []).map(i => `${i.quantity}× ${escapeHtml(i.product_name)}`).join(", ");
    const placed = new Date(o.created_at).toLocaleString();
    return `
      <tr>
        <td class="order-number-cell">${escapeHtml(o.order_number || "—")}</td>
        <td>${escapeHtml(o.customer_name)}</td>
        <td>${escapeHtml(o.phone)}</td>
        <td class="order-items-line">${itemsLine}</td>
        <td>$${Number(o.total).toFixed(2)}</td>
        <td>${buildStatusCell(o)}</td>
        <td>${buildTrackingCell(o)}</td>
        <td id="webhookCell-${o.id}">${buildWebhookCell(o, latestLogByOrder[o.id])}</td>
        <td>${placed}</td>
      </tr>`;
  }).join("");

  body.querySelectorAll(".pipe-step").forEach(b => b.addEventListener("click", () => updateOrderStatus(b.dataset.id, b.dataset.status)));
  body.querySelectorAll(".cancel-link").forEach(b => b.addEventListener("click", () => {
    if (confirm("Cancel this order? The customer will get a cancellation message.")) updateOrderStatus(b.dataset.id, "cancelled");
  }));
  body.querySelectorAll(".reactivate-link").forEach(b => b.addEventListener("click", () => {
    if (confirm("Reactivate this order back to \"Ordered\"?")) updateOrderStatus(b.dataset.id, "ordered");
  }));
  body.querySelectorAll(".save-tracking-btn").forEach(b => b.addEventListener("click", () => saveTracking(b.dataset.id)));
  body.querySelectorAll(".webhook-check-btn").forEach(b => b.addEventListener("click", () => recheckNotification(b.dataset.id)));

  positionAllPipeIndicators();
}

function buildStatusCell(order) {
  if (order.status === "cancelled") {
    return `
      <div class="status-cell">
        <span class="cancelled-badge">✕ Cancelled</span>
        <button class="reactivate-link" data-id="${order.id}">Reactivate</button>
      </div>`;
  }
  const activeIndex = STATUS_STEPS.indexOf(order.status);
  const stepsHtml = STATUS_STEPS.map((s, i) => `
    <button class="pipe-step ${i === activeIndex ? "active" : ""}" data-id="${order.id}" data-status="${s}">${STATUS_LABELS[s]}</button>`).join("");
  return `
    <div class="status-cell">
      <div class="status-pipeline">
        <span class="pipe-indicator"></span>
        ${stepsHtml}
      </div>
      <button class="cancel-link" data-id="${order.id}">Cancel order</button>
    </div>`;
}

// Sizes/positions the sliding pill under the active pipeline step.
// Runs after the table HTML is in the DOM so offsetWidth/offsetLeft
// are accurate.
function positionAllPipeIndicators() {
  document.querySelectorAll(".status-pipeline").forEach(pipeline => {
    const active = pipeline.querySelector(".pipe-step.active");
    const indicator = pipeline.querySelector(".pipe-indicator");
    if (!active || !indicator) return;
    indicator.style.width = `${active.offsetWidth}px`;
    indicator.style.transform = `translateX(${active.offsetLeft - 3}px)`;
  });
}

function buildTrackingCell(order) {
  if (order.status === "cancelled") return `<span style="color:var(--muted);font-size:12.5px;">—</span>`;
  const trackingVal = escapeAttr(order.tracking_number || "");
  const etaVal = order.estimated_delivery ? String(order.estimated_delivery).slice(0, 10) : "";
  return `
    <div class="tracking-cell">
      <input type="text" class="tracking-input" data-id="${order.id}" placeholder="Tracking #" value="${trackingVal}" />
      <input type="date" class="eta-input" data-id="${order.id}" value="${etaVal}" />
      <button class="save-tracking-btn" data-id="${order.id}">Save</button>
    </div>`;
}

async function saveTracking(orderId) {
  const trackingInput = document.querySelector(`.tracking-input[data-id="${orderId}"]`);
  const etaInput = document.querySelector(`.eta-input[data-id="${orderId}"]`);
  const tracking_number = trackingInput.value.trim() || null;
  const estimated_delivery = etaInput.value || null;
  const { error } = await supabaseClient.from("orders").update({ tracking_number, estimated_delivery }).eq("id", orderId);
  if (error) return showToast(error.message);
  showToast("Tracking info saved — customer notified if the order is shipped");
  loadOrders();
}

// Shows whether the WhatsApp message for this order's most recent
// event has actually gone out (sent), is still in flight (pending),
// or failed — pulled from notification_logs, which n8n reports back
// into after it actually calls Green API.
function buildWebhookCell(order, log) {
  if (!log) {
    return `
      <div class="webhook-cell">
        <span class="webhook-status pending"><span class="dot"></span>No message yet</span>
      </div>`;
  }
  const cssClass = log.status === "sent" ? "ok" : log.status === "failed" ? "fail" : "pending";
  const when = new Date(log.updated_at || log.created_at).toLocaleString();
  // message_text is only populated once n8n reports back (see
  // notification-message-text-fix.sql) - it holds the exact WhatsApp
  // text that was sent (or attempted, on failure), never invented here.
  const messageHtml = log.message_text
    ? `<span class="webhook-message" title="${escapeAttr(log.message_text)}">${escapeHtml(log.message_text)}</span>`
    : "";
  return `
    <div class="webhook-cell">
      <span class="webhook-status ${cssClass}"><span class="dot"></span>${MESSAGE_LABELS[log.status] || log.status}</span>
      <span class="webhook-meta">${escapeHtml(EVENT_LABELS[log.event] || log.event)} · ${when}</span>
      ${messageHtml}
      ${log.status === "failed" && log.error_message ? `<span class="webhook-error">${escapeHtml(log.error_message)}</span>` : ""}
      <button class="webhook-check-btn" data-id="${order.id}">Recheck</button>
    </div>`;
}

function updateWebhookCellInPlace(orderId) {
  const td = document.getElementById(`webhookCell-${orderId}`);
  if (!td) return; // order isn't in the currently loaded table
  const order = currentOrders.find(o => o.id === orderId) || { id: orderId };
  td.innerHTML = buildWebhookCell(order, latestLogByOrder[orderId]);
  const btn = td.querySelector(".webhook-check-btn");
  if (btn) btn.addEventListener("click", () => recheckNotification(orderId));
}

async function recheckNotification(orderId) {
  const { data, error } = await supabaseClient
    .from("notification_logs")
    .select("*")
    .eq("order_id", orderId)
    .order("created_at", { ascending: false })
    .limit(1);
  if (error) return showToast(error.message);
  latestLogByOrder[orderId] = (data && data[0]) || null;
  updateWebhookCellInPlace(orderId);
}

async function updateOrderStatus(orderId, status) {
  const { error } = await supabaseClient.from("orders").update({ status }).eq("id", orderId);
  if (error) return showToast(error.message);
  showToast("Order updated — customer notified");
  loadOrders();
}

function showToast(msg) { toast.textContent = msg; toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 2200); }
function placeholderImg() { return "https://placehold.co/80x80?text=%20"; }
function escapeHtml(str) { return String(str ?? "").replace(/[&<>"']/g, s => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[s])); }
function escapeAttr(str) { return escapeHtml(str); }
</script>
</body>
